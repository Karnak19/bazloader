; BULLOADER+ firmware — ESP32-C3 SuperMini
; `pio run`          -> release (real IR beam)
; `pio run -e sim`   -> fake BB pulses (SIMULATE_IR), no mechanism needed

[platformio]
default_envs = release

[env]
; Pinned: a platform bump can switch the Arduino core (2.x vs 3.x LEDC API differs).
platform = espressif32 @ 7.1.3
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; The SuperMini has no USB-serial chip: Serial goes through the C3's native USB.
; Without these flags Serial prints nowhere. Also frees GPIO 20/21 (we use 20 for SCL).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    olikraus/U8g2@^2.35.0

[env:release]

[env:sim]
build_flags =
    ${env.build_flags}
    -DSIMULATE_IR
