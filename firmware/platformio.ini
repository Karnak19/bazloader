; BULLOADER+ firmware — ESP32-C3 SuperMini
; `pio run`             -> release (real IR beam)
; `pio run -e sim`      -> fake BB pulses (SIMULATE_IR), no mechanism needed
; `pio test -e native`  -> run logic tests on the host (the files with no Arduino include)

[platformio]
default_envs = release

[esp32]
; Pinned: a platform bump can switch the Arduino core (2.x vs 3.x LEDC API differs).
platform = espressif32 @ 7.1.3
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; The SuperMini has no USB-serial chip: Serial goes through the C3's native USB.
; Without these flags Serial prints nowhere. Also frees GPIO 20/21 (we use 20 for SCL).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; BLE peripheral only, one client at a time: drops NimBLE's central/scanner code and RAM.
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    olikraus/U8g2@^2.35.0

[env:release]
extends = esp32

[env:sim]
extends = esp32
build_flags =
    ${esp32.build_flags}
    -DSIMULATE_IR

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<run.cpp> +<battery.cpp> +<controls.cpp> +<screen.cpp> +<settings.cpp>
    +<ble_logic.cpp>
build_flags = -std=c++17
